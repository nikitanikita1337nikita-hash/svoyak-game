openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /categories:
    get:
      operationId: getCategories
      responses:
        "200":
          description: Category library
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
  /rooms:
    post:
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomSession" }
  /rooms/{code}/join:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string } }
    post:
      operationId: joinRoom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerInput" }
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomSession" }
  /rooms/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string } }
    get:
      operationId: getRoom
      description: Bearer token required. Poll every 1000ms for state and presence.
      responses:
        "200":
          description: Current personalized room state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomState" }
  /rooms/{code}/actions:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string } }
    post:
      operationId: roomAction
      description: Bearer token required. Host controls all except buzz and leave.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameAction" }
      responses:
        "200":
          description: Updated room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomState" }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Category:
      type: object
      required: [id, name, group, description, questionCount]
      properties:
        id: { type: string }
        name: { type: string }
        group: { type: string }
        description: { type: string }
        questionCount: { type: integer }
    PlayerInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 24 }
    RoomInput:
      type: object
      required: [name, categoryIds]
      properties:
        name: { type: string, minLength: 2, maxLength: 24 }
        categoryIds:
          type: array
          minItems: 6
          maxItems: 6
          items: { type: string }
        timerSeconds: { type: integer, minimum: 10, maximum: 120, default: 30 }
    RoomSession:
      type: object
      required: [code, token, participantId, role]
      properties:
        code: { type: string }
        token: { type: string }
        participantId: { type: string }
        role: { type: string, enum: [host, player] }
    Player:
      type: object
      required: [id, name, score, online]
      properties:
        id: { type: string }
        name: { type: string }
        score: { type: integer }
        online: { type: boolean }
    BoardCategory:
      type: object
      required: [id, name, questions]
      properties:
        id: { type: string }
        name: { type: string }
        questions:
          type: array
          items: { $ref: "#/components/schemas/BoardQuestion" }
    BoardQuestion:
      type: object
      required: [id, value, played]
      properties:
        id: { type: string }
        value: { type: integer }
        played: { type: boolean }
    ActiveQuestion:
      type: object
      required: [id, category, value, text, revealed, remainingSeconds, attemptedIds]
      properties:
        id: { type: string }
        category: { type: string }
        value: { type: integer }
        text: { type: string }
        answer: { type: string }
        revealed: { type: boolean }
        buzzedPlayerId: { type: ["string", "null"] }
        deadline: { type: ["number", "null"] }
        remainingSeconds: { type: number }
        attemptedIds:
          type: array
          items: { type: string }
    RoomState:
      type: object
      required: [code, status, role, participantId, hostName, hostOnline, players, board, round, timerSeconds, serverTime, active, activity]
      properties:
        code: { type: string }
        status: { type: string, enum: [lobby, playing, roundEnd, finished, closed] }
        role: { type: string, enum: [host, player] }
        participantId: { type: string }
        hostName: { type: string }
        hostOnline: { type: boolean }
        players:
          type: array
          items: { $ref: "#/components/schemas/Player" }
        board:
          type: array
          items: { $ref: "#/components/schemas/BoardCategory" }
        round: { type: integer }
        timerSeconds: { type: integer }
        serverTime: { type: number }
        active:
          oneOf:
            - { $ref: "#/components/schemas/ActiveQuestion" }
            - { type: "null" }
        activity:
          type: array
          items: { type: string }
    GameAction:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [start, select, buzz, correct, incorrect, reveal, next, pause, resume, nextRound, finish, score, kick, leave, close] }
        questionId: { type: string }
        playerId: { type: string }
        delta: { type: integer }
